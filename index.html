<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>PEA Q-Track</title>
    
    <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1dNIDscYI89ssTwJXGHeI_4Ppu0fmw7wy&sz=w512">
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1dNIDscYI89ssTwJXGHeI_4Ppu0fmw7wy&sz=w512">
    <meta name="theme-color" content="#5b1a80">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #2e0249 0%, #5b1a80 100%); font-family: sans-serif; color: white; text-align: center; }
        .logo-img { width: 150px; height: 150px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 30px; border: 3px solid rgba(255,255,255,0.2); object-fit: cover; background-color: #5b1a80; }
        
        /* ✅ อัปเดตขนาดฟอนต์ให้เด่นขึ้น */
        h1 { margin: 0 0 5px 0; font-size: 2.2rem; color: #ffc107; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-weight: 800; letter-spacing: 1px;}
        p { margin: 0 0 30px 0; color: rgba(255,255,255,0.8); font-size: 1.1rem; }
        
        .btn-enter { background: linear-gradient(180deg, #ffca2c 0%, #ffc107 100%); color: #2e0249; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; text-decoration: none; box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4); display: inline-block; transition: transform 0.2s; }
        .btn-enter:active { transform: scale(0.95); }
        .instruction { margin-top: 40px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 15px; max-width: 80%; border: 1px dashed rgba(255,255,255,0.2); }
        .instruction p { margin: 0; font-size: 0.9rem; color: #fff; line-height: 1.5; }
        .loader { display: none; margin-top: 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #ffc107; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <img src="https://drive.google.com/thumbnail?id=1dNIDscYI89ssTwJXGHeI_4Ppu0fmw7wy&sz=w512" alt="Icon" class="logo-img">
    
    <h1>PEA Q-Track</h1>
    <p>ระบบติดตามแบบสอบถาม</p>

    <div id="browser-view">
        <a href="https://script.google.com/macros/s/AKfycbzGdcxacuubpVmpoZgakrwFRwXi3I1XfGI7OW7UysZD3Ht0wofLQ33Rlo2iKBRlP0h6/exec" class="btn-enter">เข้าสู่ระบบ</a>
        
        <div class="instruction">
            <p>💡 <b>เคล็ดลับการใช้งาน:</b><br>กรุณากดปุ่ม <b>แชร์ (Share)</b> ด้านล่าง<br>แล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b><br>(Add to Home Screen) เพื่อติดตั้งเป็นแอป</p>
        </div>
    </div>

    <div id="app-view" class="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #ffc107; font-weight: bold;">กำลังเข้าสู่ระบบ...</p>
    </div>

    <script>
        var appUrl = "https://script.google.com/macros/s/AKfycbzGdcxacuubpVmpoZgakrwFRwXi3I1XfGI7OW7UysZD3Ht0wofLQ33Rlo2iKBRlP0h6/exec"; // ⚠️ นำลิงก์ของ Google Apps Script มาวางแทนที่ข้อความนี้
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        if (isStandalone) {
            document.getElementById('browser-view').style.display = 'none';
            document.getElementById('app-view').style.display = 'block';
            setTimeout(function() { window.location.replace(appUrl); }, 500);
        }
    </script>
</body>
</html>
