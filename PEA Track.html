<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEA Smart Tracker</title>
    
    <link rel="apple-touch-icon" href="https://drive.google.com/uc?export=view&id=1dNIDscYI89ssTwJXGHeI_4Ppu0fmw7wy">
    
    <link rel="icon" type="image/png" href="https://drive.google.com/uc?export=view&id=1dNIDscYI89ssTwJXGHeI_4Ppu0fmw7wy">
    
    <meta name="theme-color" content="#5b1a80">

    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzGdcxacuubpVmpoZgakrwFRwXi3I1XfGI7OW7UysZD3Ht0wofLQ33Rlo2iKBRlP0h6/exec">
    
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #5b1a80; font-family: sans-serif; color: white; }
        .loader { text-align: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-top-color: #ffc107; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>กำลังพาท่านเข้าสู่ระบบ...</h2>
    </div>

    <script>
        // ⚠️ นำลิงก์ Google Apps Script ของคุณมาวางแทนที่คำว่า วางลิงก์ระบบของคุณที่นี่ เช่นกันครับ
        setTimeout(function() {
            window.location.href = "https://script.google.com/macros/s/AKfycbzGdcxacuubpVmpoZgakrwFRwXi3I1XfGI7OW7UysZD3Ht0wofLQ33Rlo2iKBRlP0h6/exec";
        }, 500);
    </script>
</body>
</html>
